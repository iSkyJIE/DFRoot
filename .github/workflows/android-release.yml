name: Android Build & Release

on:
  push:
    branches:
      - master
    tags:
      - 'v1.0.*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate release tag and export Android version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "${TAG}" =~ ^v1\.0\.[0-9]{6}$ ]]; then
            echo "Invalid release tag: ${TAG}"
            echo "Expected format: v1.0.YYMMDD (example: v1.0.261001)"
            exit 1
          fi

          DATE_PART="${TAG#v1.0.}"
          YY="${DATE_PART:0:2}"
          MM="${DATE_PART:2:2}"
          DD="${DATE_PART:4:2}"
          VALID_DATE="$(date -d "20${YY}-${MM}-${DD}" +%y%m%d 2>/dev/null || true)"

          if [[ "${VALID_DATE}" != "${DATE_PART}" ]]; then
            echo "Invalid calendar date in release tag: ${TAG}"
            exit 1
          fi

          echo "DFROOT_VERSION_NAME=1.0.${DATE_PART}" >> "${GITHUB_ENV}"
          echo "DFROOT_VERSION_CODE=$((10#${DATE_PART}))" >> "${GITHUB_ENV}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install pinned Android build dependencies
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager             "platform-tools"             "platforms;android-36"             "build-tools;35.0.0"             "cmake;3.22.1"             "ndk;27.0.12077973"

      - name: Build release APK
        shell: bash
        run: |
          chmod +x gradlew
          if [[ "${GITHUB_REF}" == refs/tags/v1.0.* ]]; then
            ./gradlew --no-daemon :app:assembleRelease               "-PDFROOT_VERSION_NAME=${DFROOT_VERSION_NAME}"               "-PDFROOT_VERSION_CODE=${DFROOT_VERSION_CODE}"
          else
            ./gradlew --no-daemon :app:assembleRelease
          fi

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/dirtyfrag.apk"
          test -f "${APK}"
          ls -lh "${APK}"
          sha256sum "${APK}"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: DFRoot-${{ github.ref_name }}
          path: app/build/outputs/apk/release/dirtyfrag.apk
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v1.0.')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ASSET="DFRoot-${TAG}.apk"
          cp app/build/outputs/apk/release/dirtyfrag.apk "${ASSET}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ASSET}#DFRoot APK" --clobber
          else
            gh release create "${TAG}" "${ASSET}#DFRoot APK"               --title "DFRoot ${TAG}"               --generate-notes
          fi
