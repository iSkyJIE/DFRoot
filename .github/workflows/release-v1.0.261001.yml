name: Build and upload v1.0.261001

on:
  push:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: v1.0.261001

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android build dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Use Gradle 8.9 for AGP 8.7.3
        run: |
          sed -i 's#gradle-[0-9.]*-bin.zip#gradle-8.9-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/release/dirtyfrag.apk
          ls -lh app/build/outputs/apk/release/dirtyfrag.apk
          sha256sum app/build/outputs/apk/release/dirtyfrag.apk

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v1.0.261001" "app/build/outputs/apk/release/dirtyfrag.apk#DFRoot v1.0.261001 APK" --clobber
